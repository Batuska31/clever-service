<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Thinking Agent</title>
    <style>
        :root {
            --bg: #04040c;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.3);
            --purple: #7c3aed;
            --white: #ffffff;
            --font: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a1f 0%, #04040c 100%);
        }

        #canvas-container {
            position: relative;
            width: 800px;
            height: 800px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        #canvas-container:hover canvas {
            transform: scale(1.02);
        }

        .ui-overlay {
            position: absolute;
            bottom: 40px;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .task-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            opacity: 0.8;
            height: 20px;
            transition: opacity 0.5s ease;
        }

        .hint {
            margin-top: 10px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.2em;
        }

        /* Iridescent Microphone Button */
        .mic-btn {
            position: absolute;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ff5eb3 0%, #7c3aed 50%, #75b3ff 100%);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow:
                0 0 0 0 rgba(124, 58, 237, 0),
                0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 2px 15px rgba(255, 255, 255, 0.4);
            animation: orb-float 4s ease-in-out infinite;
            cursor: pointer;
        }

        .mic-btn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff5eb3, #7c3aed, #75b3ff);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            transition: opacity 0.5s;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow:
                0 0 40px rgba(124, 58, 237, 0.5),
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 2px 20px rgba(255, 255, 255, 0.5);
        }

        .mic-btn:hover::before {
            opacity: 0.6;
        }

        @keyframes orb-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .mic-btn svg {
            width: 50px;
            height: 50px;
            fill: white;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        .active .mic-btn {
            opacity: 0;
            transform: scale(1.5);
            pointer-events: none;
            filter: blur(20px);
        }
    </style>
</head>

<body>

    <div id="canvas-container">
        <div class="mic-btn" id="micBtn">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path
                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </div>
        <canvas id="aiCanvas" width="800" height="800"></canvas>
    </div>

    <div class="ui-overlay">
        <div class="task-text" id="taskText">Click to Activate AI</div>
        <div class="hint">NEURAL INTERFACE V1.0</div>
    </div>

    <script>
        const canvas = document.getElementById('aiCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const taskText = document.getElementById('taskText');
        const micBtn = document.getElementById('micBtn');

        let isActive = false;
        let particles = [];
        const particleCount = 400;
        let rotation = 0;

        const tasks = [
            "Analyzing context...",
            "Searching vector space...",
            "Optimizing response...",
            "Synthesizing data...",
            "Calculating probabilities...",
            "Refining neural weights..."
        ];
        let taskIndex = 0;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // Sphere coordinates
                this.phi = Math.random() * Math.PI * 2;
                this.theta = Math.acos((Math.random() * 2) - 1);
                this.radius = 240;

                // Position
                this.x = 0;
                this.y = 0;
                this.z = 0;

                this.size = Math.random() * 2 + 1;
                this.speed = Math.random() * 0.02 + 0.005;
                this.pulse = Math.random() * Math.PI * 2;
            }

            update() {
                this.phi += this.speed;
                this.pulse += 0.05;

                // 3D to 2D
                this.x = this.radius * Math.sin(this.theta) * Math.cos(this.phi);
                this.y = this.radius * Math.sin(this.theta) * Math.sin(this.phi);
                this.z = this.radius * Math.cos(this.theta);

                // Perspective projection
                const perspective = 800 / (800 + this.z);
                this.renderX = (this.x * perspective) + 400;
                this.renderY = (this.y * perspective) + 400;
                this.renderSize = this.size * perspective;
                this.opacity = (perspective - 0.5) * 2;
            }

            draw() {
                const glow = Math.sin(this.pulse) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(this.renderX, this.renderY, this.renderSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity * (0.3 + glow * 0.7)})`;
                ctx.fill();

                if (glow > 0.8) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnectingLines() {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < particles.length; i += 20) {
                for (let j = i + 1; j < particles.length; j += 20) {
                    const dx = particles[i].renderX - particles[j].renderX;
                    const dy = particles[i].renderY - particles[j].renderY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.moveTo(particles[i].renderX, particles[i].renderY);
                        ctx.lineTo(particles[j].renderX, particles[j].renderY);
                    }
                }
            }
            ctx.stroke();
        }

        function drawPulses() {
            const time = Date.now() * 0.001;
            ctx.beginPath();
            ctx.arc(400, 400, 240 + Math.sin(time * 2) * 5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(124, 58, 237, ${0.1 + Math.sin(time) * 0.05})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function animate() {
            ctx.clearRect(0, 0, 800, 800);

            if (isActive) {
                // Sort particles by Z for painters algorithm
                particles.sort((a, b) => b.z - a.z);

                drawPulses();

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                drawConnectingLines();
            } else {
                // Static idle state - subtle particles around center
                ctx.beginPath();
                ctx.arc(400, 400, 100, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        container.addEventListener('click', () => {
            if (!isActive) {
                isActive = true;
                container.classList.add('active');
                startTaskCycling();
            }
        });

        function startTaskCycling() {
            taskText.innerText = tasks[0];
            setInterval(() => {
                taskIndex = (taskIndex + 1) % tasks.length;
                taskText.style.opacity = 0;
                setTimeout(() => {
                    taskText.innerText = tasks[taskIndex];
                    taskText.style.opacity = 0.8;
                }, 500);
            }, 3000);
        }

        init();
        animate();
    </script>
</body>

</html>
